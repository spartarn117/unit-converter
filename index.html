<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Unit Converter</title>

<style>

/* =========================================================
   기본 설정
========================================================= */

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;

  font-family:
    Arial,
    "Noto Sans KR",
    sans-serif;

  transition:
    background 0.5s ease,
    color 0.4s ease;

  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);

  overflow-x: hidden;
}


/* =========================================================
   공통 CSS 변수
========================================================= */

body {
  --background: #222;
  --panel: #bbb;
  --panel2: #999;

  --text: #222;
  --subtext: #555;

  --accent: #62b34b;
  --accent2: #39862b;

  --input-bg: #222;
  --input-text: white;

  --result-bg: #111;
  --result-text: #55ff55;

  --border-light: white;
  --border-dark: #222;

  --shadow: rgba(0,0,0,.5);

  --title-color: white;
  --title-shadow: #222;

  --radius: 0px;

  --title-spacing: 1px;
}


/* =========================================================
   MINECRAFT 풍 테마
========================================================= */

body.minecraft {

  --panel: #c5c5c5;
  --panel2: #919191;

  --text: #242424;
  --subtext: #444;

  --accent: #6aaf45;
  --accent2: #477c30;

  --input-bg: #202020;
  --input-text: #ffffff;

  --result-bg: #171717;
  --result-text: #55ff55;

  --border-light: #eeeeee;
  --border-dark: #252525;

  --title-color: #dddddd;
  --title-shadow: #252525;

  --radius: 0px;

  background:
    linear-gradient(
      rgba(0,0,0,.24),
      rgba(0,0,0,.24)
    ),
    repeating-linear-gradient(
      0deg,
      #6c4932 0px,
      #6c4932 32px,
      #765039 32px,
      #765039 64px
    );
}


/* 잔디 상단 효과 */

body.minecraft::before {
  content: "";

  position: fixed;
  z-index: -1;

  top: 0;
  left: 0;
  right: 0;

  height: 180px;

  background:
    repeating-linear-gradient(
      90deg,
      #649e3a 0px,
      #649e3a 38px,
      #75ae44 38px,
      #75ae44 76px
    );

  box-shadow:
    0 15px 0 #4b762e;
}


/* =========================================================
   OVERWATCH 풍 테마
========================================================= */

body.overwatch {

  --panel: rgba(244,247,249,.95);
  --panel2: #dde3e8;

  --text: #28313b;
  --subtext: #63707b;

  --accent: #f39c24;
  --accent2: #d97a00;

  --input-bg: #343d47;
  --input-text: #ffffff;

  --result-bg: #242c34;
  --result-text: #ffad32;

  --border-light: #ffffff;
  --border-dark: #7b858e;

  --title-color: #f3f5f6;
  --title-shadow: #343b42;

  --radius: 4px;

  background:
    radial-gradient(
      circle at 50% 10%,
      #d8e0e5 0%,
      #8997a2 35%,
      #323a43 100%
    );
}


/* 오버워치풍 기하학 배경 */

body.overwatch::before {

  content: "";

  position: fixed;

  inset: 0;

  z-index: -1;

  opacity: .25;

  background:

    linear-gradient(
      115deg,
      transparent 40%,
      rgba(255,255,255,.25) 40%,
      rgba(255,255,255,.25) 41%,
      transparent 41%
    ),

    linear-gradient(
      65deg,
      transparent 55%,
      rgba(255,160,30,.24) 55%,
      rgba(255,160,30,.24) 56%,
      transparent 56%
    );
}


/* =========================================================
   STARCRAFT 풍 테마
========================================================= */

body.starcraft {

  --panel: rgba(10,25,38,.94);
  --panel2: rgba(18,44,62,.95);

  --text: #c9efff;
  --subtext: #6fa8c0;

  --accent: #40ceff;
  --accent2: #127aaf;

  --input-bg: #07111b;
  --input-text: #d4f3ff;

  --result-bg: #02090e;
  --result-text: #72e5ff;

  --border-light: #3bc8ff;
  --border-dark: #09151f;

  --title-color: #b6edff;
  --title-shadow: #087aa7;

  --radius: 2px;

  background:

    radial-gradient(
      circle at 20% 20%,
      rgba(20,97,142,.35),
      transparent 30%
    ),

    radial-gradient(
      circle at 80% 60%,
      rgba(0,156,218,.15),
      transparent 30%
    ),

    linear-gradient(
      145deg,
      #020407,
      #06131e 55%,
      #010306
    );
}


/* 우주 별 효과 */

body.starcraft::before {

  content: "";

  position: fixed;

  inset: 0;

  z-index: -1;

  opacity: .7;

  background-image:

    radial-gradient(
      white 1px,
      transparent 1px
    ),

    radial-gradient(
      #69dfff 1px,
      transparent 1px
    );

  background-size:
    91px 91px,
    137px 137px;

  background-position:
    10px 10px,
    55px 80px;
}


/* =========================================================
   상단
========================================================= */

header {

  position: relative;

  text-align: center;

  padding:
    calc(55px + env(safe-area-inset-top))
    20px
    30px;
}


/* =========================================================
   메인 타이틀
========================================================= */

.main-title {

  margin: 0;

  font-size:
    clamp(38px, 8vw, 76px);

  font-weight: 900;

  line-height: .95;

  letter-spacing:
    var(--title-spacing);

  color:
    var(--title-color);

  transition:
    all .4s ease;
}


/* Minecraft 타이틀 */

.minecraft .main-title {

  font-family:
    Impact,
    "Arial Black",
    sans-serif;

  letter-spacing: 2px;

  transform:
    scaleY(1.12);

  text-shadow:

    0 3px 0 #aaa,
    0 6px 0 #777,
    0 9px 0 #444,

    4px 12px 0 #1b1b1b,

    -2px -2px 0 #252525,
    2px -2px 0 #252525,
    -2px 2px 0 #252525,
    2px 2px 0 #252525;
}


/* Overwatch 타이틀 */

.overwatch .main-title {

  font-family:
    "Arial Narrow",
    Arial,
    sans-serif;

  font-style: italic;

  letter-spacing: 5px;

  text-shadow:
    0 3px 0 #6a737a,
    0 6px 12px rgba(0,0,0,.5);
}


/* 오렌지 바 */

.overwatch .main-title::after {

  content: "";

  display: block;

  width: 85px;
  height: 7px;

  margin:
    17px auto 0;

  background:
    #f39c24;

  transform:
    skewX(-28deg);
}


/* StarCraft 타이틀 */

.starcraft .main-title {

  font-family:
    "Arial Narrow",
    Impact,
    sans-serif;

  font-style: italic;

  letter-spacing: 7px;

  color: #c5efff;

  text-shadow:

    0 0 4px #fff,

    0 0 10px #43d5ff,

    0 0 25px #008bd0,

    3px 4px 0 #06101a;
}


/* =========================================================
   부제목
========================================================= */

.subtitle {

  display: inline-block;

  margin-top: 20px;

  padding:
    7px 15px;

  font-size: 12px;

  font-weight: 700;

  letter-spacing: 3px;

  color:
    var(--title-color);
}


/* =========================================================
   테마 버튼
========================================================= */

.theme-control {

  position: fixed;

  z-index: 100;

  top:
    calc(15px + env(safe-area-inset-top));

  right: 15px;
}


.theme-button {

  min-height: 44px;

  padding:
    8px 14px;

  font-weight: 900;

  letter-spacing: 1px;

  cursor: pointer;

  color:
    var(--input-text);

  background:
    var(--input-bg);

  border:
    2px solid
    var(--accent);

  border-radius:
    var(--radius);

  box-shadow:
    3px 3px 0
    var(--shadow);

  transition:
    .2s;
}


.theme-button:hover {

  color:
    var(--accent);
}


.theme-button:active {

  transform:
    translate(2px,2px);
}


/* =========================================================
   메인 영역
========================================================= */

.container {

  width:
    min(94%, 820px);

  margin:
    0 auto;

  padding-bottom:
    50px;
}


/* =========================================================
   패널
========================================================= */

.converter {

  padding:
    28px;

  color:
    var(--text);

  background:
    var(--panel);

  border:
    3px solid
    var(--border-dark);

  border-top-color:
    var(--border-light);

  border-left-color:
    var(--border-light);

  border-radius:
    var(--radius);

  box-shadow:
    9px 10px 0
    var(--shadow);

  transition:
    all .4s ease;
}


/* StarCraft 금속 효과 */

.starcraft .converter {

  border-color:
    #237797;

  box-shadow:

    0 0 15px
    rgba(42,194,255,.35),

    8px 10px 0
    rgba(0,0,0,.7);
}


/* Overwatch 각진 패널 */

.overwatch .converter {

  clip-path:
    polygon(
      22px 0,
      100% 0,
      100% calc(100% - 22px),
      calc(100% - 22px) 100%,
      0 100%,
      0 22px
    );
}


/* =========================================================
   폼
========================================================= */

.section {

  margin-bottom:
    23px;
}


label {

  display:
    block;

  margin-bottom:
    8px;

  font-size:
    13px;

  font-weight:
    800;

  letter-spacing:
    .5px;

  color:
    var(--text);
}


select,
input {

  width:
    100%;

  min-height:
    53px;

  padding:
    12px 14px;

  background:
    var(--input-bg);

  color:
    var(--input-text);

  border:
    2px solid
    var(--border-dark);

  border-radius:
    var(--radius);

  font-size:
    17px;

  font-weight:
    600;

  outline:
    none;

  transition:
    .2s;
}


select:focus,
input:focus {

  border-color:
    var(--accent);

  box-shadow:
    0 0 0 3px
    color-mix(
      in srgb,
      var(--accent) 25%,
      transparent
    );
}


/* =========================================================
   단위 선택
========================================================= */

.unit-grid {

  display:
    grid;

  grid-template-columns:
    minmax(0,1fr)
    70px
    minmax(0,1fr);

  gap:
    13px;

  align-items:
    end;
}


.swap-wrapper {

  display:
    flex;

  justify-content:
    center;
}


.swap-button {

  width:
    55px;

  height:
    55px;

  cursor:
    pointer;

  font-size:
    23px;

  font-weight:
    900;

  color:
    white;

  background:
    var(--accent);

  border:
    3px solid
    var(--accent2);

  border-radius:
    var(--radius);

  box-shadow:
    3px 4px 0
    var(--shadow);

  transition:
    .15s;
}


.swap-button:hover {

  filter:
    brightness(1.15);
}


.swap-button:active {

  transform:
    translate(2px,2px);

  box-shadow:
    1px 1px 0
    var(--shadow);
}


/* =========================================================
   결과
========================================================= */

.result-box {

  margin-top:
    30px;

  padding:
    27px 18px;

  text-align:
    center;

  background:
    var(--result-bg);

  border:
    3px solid
    var(--accent2);

  border-radius:
    var(--radius);

  box-shadow:
    inset 0 0 15px
    rgba(0,0,0,.35);
}


.starcraft .result-box {

  box-shadow:

    inset 0 0 25px
    rgba(0,140,210,.25),

    0 0 10px
    rgba(50,205,255,.25);
}


.result-label {

  margin-bottom:
    9px;

  color:
    var(--subtext);

  font-size:
    12px;

  font-weight:
    800;

  letter-spacing:
    2px;
}


#result {

  color:
    var(--result-text);

  font-size:
    clamp(27px,6vw,38px);

  font-weight:
    900;

  word-break:
    break-word;
}


.starcraft #result {

  text-shadow:
    0 0 10px #2ecbff;
}


#formula {

  margin-top:
    12px;

  color:
    #aaa;

  font-size:
    14px;

  min-height:
    20px;
}


.copy-button {

  min-height:
    45px;

  margin-top:
    19px;

  padding:
    9px 22px;

  cursor:
    pointer;

  font-weight:
    800;

  color:
    white;

  background:
    var(--accent);

  border:
    2px solid
    var(--accent2);

  border-radius:
    var(--radius);
}


/* =========================================================
   현재 테마 표시
========================================================= */

.theme-name {

  margin-top:
    15px;

  text-align:
    center;

  font-size:
    11px;

  font-weight:
    800;

  letter-spacing:
    2px;

  color:
    var(--subtext);
}


/* =========================================================
   모바일
========================================================= */

@media (max-width: 640px) {

  header {

    padding-top:
      calc(
        75px +
        env(safe-area-inset-top)
      );

    padding-bottom:
      22px;
  }


  .theme-control {

    top:
      calc(
        10px +
        env(safe-area-inset-top)
      );

    right:
      10px;
  }


  .theme-button {

    min-height:
      40px;

    font-size:
      11px;
  }


  .container {

    width:
      calc(100% - 18px);
  }


  .converter {

    padding:
      19px 13px;

    box-shadow:
      5px 6px 0
      var(--shadow);
  }


  .unit-grid {

    grid-template-columns:
      1fr;

    gap:
      11px;
  }


  .swap-wrapper {

    height:
      47px;
  }


  .swap-button {

    width:
      100%;

    max-width:
      160px;

    height:
      43px;
  }


  .result-box {

    margin-top:
      22px;
  }


  .copy-button {

    width:
      100%;

    min-height:
      48px;
  }


  .minecraft .main-title {

    font-size:
      41px;
  }


  .overwatch .main-title {

    letter-spacing:
      2px;
  }


  .starcraft .main-title {

    letter-spacing:
      3px;
  }

}

</style>
</head>


<body class="minecraft">


<!-- =====================================================

===================================================== -->

<div class="theme-control">

  <button
    class="theme-button"

</div>

<main class="container">

    </div>


    <div class="section">

      <label>
        변환할 값

        inputmode="decimal"
      >

    </div>


    <div class="unit-grid">

      <div>

        <label>

          type="button"

        <select id="toUnit"></select>

      </div>

    </div>


    <div class="result-box">

      <div class="result-label">
        CONVERSION RESULT
      </div>

      <div id="result">
        -

      <div id="formula"></div>


      <button
        id="copyButton"
        class="copy-button"
        type="button"
      >
        결과 복사
      </button>

    </div>


    <div
      class="theme-name"
      id="themeName"
    >
      MINECRAFT STYLE
    </div>

  </div>

</main>

/* =========================================================
   HTML 요소
========================================================= */

const categorySelect =
  document.getElementById("category");

const inputValue =
  document.getElementById("inputValue");

const fromUnit =
  document.getElementById("fromUnit");

const toUnit =
  document.getElementById("toUnit");

const result =
  document.getElementById("result");

const formula =
  document.getElementById("formula");

const swapButton =
  document.getElementById("swapButton");

const copyButton =
  document.getElementById("copyButton");



/* =========================================================
   단위 메뉴
========================================================= */

for (const key in categories) {

  const option =
    document.createElement("option");

  option.value =
    key;

  option.textContent =
    categories[key].name;

  categorySelect.appendChild(option);

}



function updateUnits() {

  const category =
    categories[
      categorySelect.value
    ];

  fromUnit.innerHTML =
    "";

  toUnit.innerHTML =
    "";


  category.units.forEach(
    (unit,index) => {

      const a =
        document.createElement(
          "option"
        );

      a.value =
        index;

      a.textContent =
        `${unit.name} (${unit.symbol})`;


      const b =
        a.cloneNode(true);


      fromUnit.appendChild(a);

      toUnit.appendChild(b);

    }
  );


  fromUnit.value =
    category.defaultFrom;

  toUnit.value =
    category.defaultTo;

  convert();

}



/* =========================================================
   일반 단위
========================================================= */

function normalConvert(
  value,
  from,
  to
) {

  return (
    value *
    from.factor /
    to.factor
  );

}



/* =========================================================
   온도
========================================================= */

function temperatureConvert(
  value,
  from,
  to
) {

  let kelvin;


  if (from === "°C") {

    kelvin =
      value + 273.15;

  }

  else if (
    from === "K"
  ) {

    kelvin =
      value;

  }

  else if (
    from === "°F"
  ) {

    kelvin =
      (value - 32)
      * 5 / 9
      + 273.15;

  }

  else {

    kelvin =
      value * 5 / 9;

  }


  if (to === "°C") {

    return (
      kelvin - 273.15
    );

  }


  if (to === "K") {

    return kelvin;

  }


  if (to === "°F") {

    return (
      (kelvin - 273.15)
      * 9 / 5
      + 32
    );

  }


  return (
    kelvin * 9 / 5
  );

}



/* =========================================================
   숫자 출력
========================================================= */

function formatNumber(
  number
) {

  if (
    !Number.isFinite(number)
  ) {

    return "-";

  }


  if (number === 0) {

    return "0";

  }


  const abs =
    Math.abs(number);


  if (
    abs >= 1e12 ||
    abs < 1e-7
  ) {

    return number
      .toExponential(8);

  }


  return new Intl.NumberFormat(
    "ko-KR",
    {
      maximumSignificantDigits:
        12
    }
  ).format(number);

}



/* =========================================================
   계산
========================================================= */

function convert() {

  const value =
    parseFloat(
      inputValue.value
    );


  if (
    Number.isNaN(value)
  ) {

    result.textContent =
      "-";

    formula.textContent =
      "값을 입력하세요.";

    return;

  }


  const category =
    categories[
      categorySelect.value
    ];


  const from =
    category.units[
      Number(
        fromUnit.value
      )
    ];


  const to =
    category.units[
      Number(
        toUnit.value
      )
    ];


  let answer;


  if (
    category.temperature
  ) {

    answer =
      temperatureConvert(
        value,
        from.symbol,
        to.symbol
      );

  }

  else {

    answer =
      normalConvert(
        value,
        from,
        to
      );

  }


  const formatted =
    formatNumber(answer);


  result.textContent =
    `${formatted} ${to.symbol}`;


  formula.textContent =
    `${value} ${from.symbol} = ${formatted} ${to.symbol}`;

}

========================================================= */

  "click",
  () => {

    const temp =
      fromUnit.value;

    fromUnit.value =
      toUnit.value;

    toUnit.value =
      temp;

    convert();

  }
);

========================================================= */

  "click",
  async () => {

    try {

      await navigator
        .clipboard
        .writeText(
          result.textContent
        );


      copyButton.textContent =
        "복사 완료 ✓";


      setTimeout(
        () => {

          copyButton.textContent =
            "결과 복사";

        },
        1000
      );

    }

    catch {

      copyButton.textContent =
        "복사 실패";

    }

  }
);

);

  convert
);

  convert
);

);

  },

    display:
      "STARCRAFT STYLE",

    subtitle:
      "INTERSTELLAR ENGINEERING SYSTEM"
  }

];


const themeButton =
  document.getElementById(
    "themeButton"
  );

const themeName =
  document.getElementById(
    "themeName"
  );

const subtitle =
  document.getElementById(
    "subtitle"
  );


let currentTheme =
  Number(
    localStorage.getItem(
      "unitConverterTheme"
    )
  );


if (
  !Number.isInteger(
    currentTheme
  ) ||
  currentTheme < 0 ||
  currentTheme >=
    themes.length
) {

  currentTheme = 0;

}



/* 테마 적용 */

function applyTheme() {

  const theme =
    themes[currentTheme];


  document.body.className =
    theme.className;


  themeName.textContent =
    theme.display;


  subtitle.textContent =
    theme.subtitle;


  localStorage.setItem(
    "unitConverterTheme",
    currentTheme
  );

}


/* 버튼 하나로 순환 */

themeButton.addEventListener(
  "click",
  () => {

    currentTheme =
      (
        currentTheme + 1
      )
      %
      themes.length;


    applyTheme();

  }
);

========================================================= */

categorySelect.value =
  "length";

updateUnits();

applyTheme();
