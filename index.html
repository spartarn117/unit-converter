<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#5b8731">

  <title>Block Unit Converter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        "Courier New",
        Consolas,
        monospace;

      color: #222;

      /*
        잔디 + 흙 느낌의 CSS 배경
      */
      background:
        linear-gradient(
          to bottom,
          #7ab64a 0,
          #7ab64a 55px,
          #628f3c 55px,
          #628f3c 80px,
          #795438 80px,
          #60402d 100%
        );

      background-attachment: fixed;

      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }


    /* =========================
       상단 타이틀
    ========================= */

    header {
      text-align: center;

      padding:
        calc(38px + env(safe-area-inset-top))
        16px
        25px;
    }

    h1 {
      margin: 0;

      color: #fff;

      font-size: clamp(28px, 6vw, 46px);

      font-weight: 900;

      letter-spacing: 1px;

      text-shadow:
        3px 3px 0 #222,
        -2px 0 0 #222,
        0 -2px 0 #222,
        2px 0 0 #222,
        0 2px 0 #222,
        5px 5px 0 rgba(0,0,0,0.35);
    }

    .subtitle {
      display: inline-block;

      margin-top: 15px;
      padding: 7px 12px;

      background: rgba(0, 0, 0, 0.55);

      color: #f3f3f3;

      border: 2px solid #222;

      font-size: 13px;

      box-shadow:
        3px 3px 0 rgba(0,0,0,0.4);
    }


    /* =========================
       전체 영역
    ========================= */

    .container {
      width: min(94%, 820px);

      margin: 0 auto;

      padding-bottom:
        calc(45px + env(safe-area-inset-bottom));
    }


    /* =========================
       메인 블록
    ========================= */

    .converter {
      padding: 25px;

      background:
        linear-gradient(
          135deg,
          #c6c6c6,
          #a9a9a9
        );

      border:
        4px solid #222;

      border-top-color: #eee;
      border-left-color: #eee;

      box-shadow:
        7px 7px 0 rgba(0, 0, 0, 0.55);
    }


    /* =========================
       섹션 제목
    ========================= */

    .section {
      margin-bottom: 22px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-weight: 900;

      font-size: 14px;

      color: #252525;

      text-shadow:
        1px 1px 0 #eee;
    }


    /* =========================
       입력창 / 선택창
    ========================= */

    select,
    input {
      width: 100%;

      min-height: 52px;

      padding: 12px 13px;

      font-family:
        "Courier New",
        Consolas,
        monospace;

      font-size: 17px;

      font-weight: bold;

      color: #fff;

      background: #222;

      border: 4px solid #555;

      border-top-color: #111;
      border-left-color: #111;
      border-right-color: #aaa;
      border-bottom-color: #aaa;

      border-radius: 0;

      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #a8e063;

      box-shadow:
        0 0 0 3px rgba(168, 224, 99, 0.35);
    }

    input::placeholder {
      color: #aaa;
    }


    /* =========================
       단위 선택 영역
    ========================= */

    .unit-grid {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        70px
        minmax(0, 1fr);

      gap: 12px;

      align-items: end;
    }

    .swap-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* =========================
       마인크래프트 버튼 느낌
    ========================= */

    .mc-button {
      font-family:
        "Courier New",
        Consolas,
        monospace;

      font-weight: 900;

      cursor: pointer;

      border: 4px solid;

      border-top-color: #ddd;
      border-left-color: #ddd;
      border-right-color: #333;
      border-bottom-color: #333;

      background: #777;

      color: white;

      text-shadow:
        2px 2px 0 #222;

      box-shadow:
        3px 3px 0 rgba(0,0,0,0.45);

      border-radius: 0;

      -webkit-tap-highlight-color:
        transparent;
    }

    .mc-button:hover {
      background: #8a8a8a;
    }

    .mc-button:active {
      transform: translate(2px, 2px);

      box-shadow:
        1px 1px 0 rgba(0,0,0,0.45);
    }


    .swap-button {
      width: 54px;
      height: 54px;

      font-size: 24px;
    }


    /* =========================
       결과창
    ========================= */

    .result-box {
      margin-top: 28px;

      padding: 24px 18px;

      text-align: center;

      background: #1b1b1b;

      border: 5px solid;

      border-top-color: #111;
      border-left-color: #111;
      border-right-color: #777;
      border-bottom-color: #777;

      color: white;
    }

    .result-label {
      margin-bottom: 10px;

      color: #aaa;

      font-size: 13px;

      font-weight: bold;
    }

    #result {
      color: #55ff55;

      font-size:
        clamp(27px, 6vw, 38px);

      line-height: 1.3;

      font-weight: 900;

      word-break: break-word;

      text-shadow:
        2px 2px 0 #154515;
    }

    #formula {
      min-height: 20px;

      margin-top: 12px;

      color: #e0e0e0;

      font-size: 14px;

      line-height: 1.5;

      word-break: break-word;
    }

    .copy-button {
      min-height: 46px;

      margin-top: 20px;

      padding: 9px 22px;

      font-size: 14px;
    }


    /* =========================
       인벤토리 느낌 참고 영역
    ========================= */

    .tips {
      margin-top: 25px;

      padding: 20px;

      background: #c6c6c6;

      border: 4px solid #222;

      border-top-color: #eee;
      border-left-color: #eee;

      box-shadow:
        6px 6px 0 rgba(0,0,0,0.45);
    }

    .tips-title {
      margin-bottom: 13px;

      font-size: 15px;

      font-weight: 900;

      color: #333;
    }

    .inventory {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 7px;
    }

    .slot {
      min-height: 70px;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 8px;

      color: #222;

      font-size: 12px;

      font-weight: bold;

      background: #8b8b8b;

      border: 4px solid;

      border-top-color: #373737;
      border-left-color: #373737;
      border-right-color: #fff;
      border-bottom-color: #fff;
    }


    /* =========================
       바닥
    ========================= */

    footer {
      text-align: center;

      padding: 28px 10px 5px;

      color: white;

      font-size: 11px;

      font-weight: bold;

      text-shadow:
        2px 2px 0 #222;
    }


    /* =========================
       모바일
    ========================= */

    @media (max-width: 640px) {

      header {
        padding-top:
          calc(25px + env(safe-area-inset-top));

        padding-bottom: 18px;
      }

      .container {
        width: calc(100% - 20px);
      }

      .converter {
        padding: 18px 13px;

        border-width: 3px;

        box-shadow:
          5px 5px 0 rgba(0,0,0,0.5);
      }

      .unit-grid {
        grid-template-columns: 1fr;

        gap: 11px;
      }

      .swap-wrapper {
        height: 48px;
      }

      .swap-button {
        width: 100%;

        max-width: 150px;

        height: 44px;
      }

      .result-box {
        margin-top: 22px;

        padding: 22px 11px;
      }

      .copy-button {
        width: 100%;

        min-height: 49px;
      }

      .inventory {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .slot {
        min-height: 65px;
      }
    }


    @media (max-width: 360px) {

      .container {
        width: calc(100% - 12px);
      }

      select,
      input {
        font-size: 16px;
      }

      .converter {
        padding: 15px 10px;
      }

      .inventory {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>


<body>

<header>

  <h1>UNIT CONVERTER</h1>

  <div class="subtitle">
    BLOCK ENGINEERING TOOL
  </div>

</header>


<main class="container">

  <div class="converter">


    <div class="section">

      <label for="category">
        ▶ 변환 종류
      </label>

      <select id="category"></select>

    </div>


    <div class="section">

      <label for="inputValue">
        ▶ 변환할 값
      </label>

      <input
        type="number"
        id="inputValue"
        value="1"
        step="any"
        inputmode="decimal"
        autocomplete="off"
        placeholder="숫자를 입력하세요"
      >

    </div>


    <div class="unit-grid">

      <div>

        <label for="fromUnit">
          ▶ 원래 단위
        </label>

        <select id="fromUnit"></select>

      </div>


      <div class="swap-wrapper">

        <button
          class="swap-button mc-button"
          id="swapButton"
          type="button"
          aria-label="단위 서로 바꾸기"
        >
          ⇄
        </button>

      </div>


      <div>

        <label for="toUnit">
          ▶ 변환 단위
        </label>

        <select id="toUnit"></select>

      </div>

    </div>


    <div class="result-box">

      <div class="result-label">
        [ 변환 결과 ]
      </div>

      <div id="result">
        -
      </div>

      <div id="formula"></div>

      <button
        class="copy-button mc-button"
        id="copyButton"
        type="button"
      >
        결과 복사
      </button>

    </div>

  </div>


  <div class="tips">

    <div class="tips-title">
      자주 쓰는 단위
    </div>

    <div class="inventory">

      <div class="slot">
        1 MPa<br>
        ≈ 145.038 psi
      </div>

      <div class="slot">
        1 m/s<br>
        = 3.6 km/h
      </div>

      <div class="slot">
        1 kgf<br>
        = 9.80665 N
      </div>

      <div class="slot">
        1 kgf·m<br>
        = 9.80665 N·m
      </div>

      <div class="slot">
        1 평<br>
        ≈ 3.3058 m²
      </div>

      <div class="slot">
        1 PS<br>
        ≈ 735.499 W
      </div>

    </div>

  </div>


  <footer>
    BLOCK UNIT CONVERTER
  </footer>

</main>


<script>

const categories = {

  length: {
    name: "길이",
    units: [
      { name: "밀리미터", symbol: "mm", factor: 0.001 },
      { name: "센티미터", symbol: "cm", factor: 0.01 },
      { name: "미터", symbol: "m", factor: 1 },
      { name: "킬로미터", symbol: "km", factor: 1000 },
      { name: "인치", symbol: "in", factor: 0.0254 },
      { name: "피트", symbol: "ft", factor: 0.3048 },
      { name: "야드", symbol: "yd", factor: 0.9144 },
      { name: "마일", symbol: "mi", factor: 1609.344 }
    ],
    defaultFrom: 0,
    defaultTo: 2
  },


  area: {
    name: "면적",
    units: [
      { name: "제곱밀리미터", symbol: "mm²", factor: 0.000001 },
      { name: "제곱센티미터", symbol: "cm²", factor: 0.0001 },
      { name: "제곱미터", symbol: "m²", factor: 1 },
      { name: "제곱킬로미터", symbol: "km²", factor: 1000000 },
      { name: "제곱인치", symbol: "in²", factor: 0.00064516 },
      { name: "제곱피트", symbol: "ft²", factor: 0.09290304 },
      { name: "평", symbol: "평", factor: 3.305785123966942 }
    ],
    defaultFrom: 2,
    defaultTo: 6
  },


  volume: {
    name: "부피",
    units: [
      { name: "밀리리터", symbol: "mL", factor: 0.001 },
      { name: "cc", symbol: "cc", factor: 0.001 },
      { name: "리터", symbol: "L", factor: 1 },
      { name: "세제곱미터", symbol: "m³", factor: 1000 },
      { name: "세제곱인치", symbol: "in³", factor: 0.016387064 },
      { name: "세제곱피트", symbol: "ft³", factor: 28.316846592 },
      { name: "미국 갤런", symbol: "US gal", factor: 3.785411784 }
    ],
    defaultFrom: 2,
    defaultTo: 3
  },


  mass: {
    name: "질량",
    units: [
      { name: "밀리그램", symbol: "mg", factor: 0.000001 },
      { name: "그램", symbol: "g", factor: 0.001 },
      { name: "킬로그램", symbol: "kg", factor: 1 },
      { name: "톤", symbol: "t", factor: 1000 },
      { name: "온스", symbol: "oz", factor: 0.028349523125 },
      { name: "파운드", symbol: "lb", factor: 0.45359237 }
    ],
    defaultFrom: 2,
    defaultTo: 5
  },


  speed: {
    name: "속도",
    units: [
      { name: "미터/초", symbol: "m/s", factor: 1 },
      { name: "킬로미터/시", symbol: "km/h", factor: 1 / 3.6 },
      { name: "마일/시", symbol: "mph", factor: 0.44704 },
      { name: "노트", symbol: "knot", factor: 0.514444444444 }
    ],
    defaultFrom: 0,
    defaultTo: 1
  },


  pressure: {
    name: "압력",
    units: [
      { name: "파스칼", symbol: "Pa", factor: 1 },
      { name: "킬로파스칼", symbol: "kPa", factor: 1000 },
      { name: "메가파스칼", symbol: "MPa", factor: 1000000 },
      { name: "bar", symbol: "bar", factor: 100000 },
      { name: "표준대기압", symbol: "atm", factor: 101325 },
      { name: "psi", symbol: "psi", factor: 6894.757293168 },
      { name: "수은주 밀리미터", symbol: "mmHg", factor: 133.322387415 },
      { name: "kgf/cm²", symbol: "kgf/cm²", factor: 98066.5 }
    ],
    defaultFrom: 2,
    defaultTo: 5
  },


  force: {
    name: "힘",
    units: [
      { name: "뉴턴", symbol: "N", factor: 1 },
      { name: "킬로뉴턴", symbol: "kN", factor: 1000 },
      { name: "킬로그램힘", symbol: "kgf", factor: 9.80665 },
      { name: "파운드힘", symbol: "lbf", factor: 4.4482216152605 }
    ],
    defaultFrom: 0,
    defaultTo: 2
  },


  torque: {
    name: "토크",
    units: [
      { name: "뉴턴미터", symbol: "N·m", factor: 1 },
      { name: "킬로그램힘 미터", symbol: "kgf·m", factor: 9.80665 },
      { name: "파운드힘 피트", symbol: "lbf·ft", factor: 1.3558179483314 },
      { name: "파운드힘 인치", symbol: "lbf·in", factor: 0.1129848290276 }
    ],
    defaultFrom: 0,
    defaultTo: 1
  },


  energy: {
    name: "에너지",
    units: [
      { name: "줄", symbol: "J", factor: 1 },
      { name: "킬로줄", symbol: "kJ", factor: 1000 },
      { name: "메가줄", symbol: "MJ", factor: 1000000 },
      { name: "와트시", symbol: "Wh", factor: 3600 },
      { name: "킬로와트시", symbol: "kWh", factor: 3600000 },
      { name: "킬로칼로리", symbol: "kcal", factor: 4184 },
      { name: "BTU", symbol: "BTU", factor: 1055.05585262 }
    ],
    defaultFrom: 1,
    defaultTo: 4
  },


  power: {
    name: "동력",
    units: [
      { name: "와트", symbol: "W", factor: 1 },
      { name: "킬로와트", symbol: "kW", factor: 1000 },
      { name: "메가와트", symbol: "MW", factor: 1000000 },
      { name: "마력", symbol: "hp", factor: 745.699871582 },
      { name: "미터마력", symbol: "PS", factor: 735.49875 }
    ],
    defaultFrom: 1,
    defaultTo: 4
  },


  angularSpeed: {
    name: "회전속도 / 각속도",
    units: [
      {
        name: "RPM",
        symbol: "rpm",
        factor: 2 * Math.PI / 60
      },
      {
        name: "라디안/초",
        symbol: "rad/s",
        factor: 1
      },
      {
        name: "회전/초",
        symbol: "rps",
        factor: 2 * Math.PI
      }
    ],
    defaultFrom: 0,
    defaultTo: 1
  },


  flow: {
    name: "체적유량",
    units: [
      {
        name: "세제곱미터/초",
        symbol: "m³/s",
        factor: 1
      },
      {
        name: "세제곱미터/시",
        symbol: "m³/h",
        factor: 1 / 3600
      },
      {
        name: "리터/초",
        symbol: "L/s",
        factor: 0.001
      },
      {
        name: "리터/분",
        symbol: "L/min",
        factor: 0.001 / 60
      },
      {
        name: "리터/시",
        symbol: "L/h",
        factor: 0.001 / 3600
      },
      {
        name: "CFM",
        symbol: "ft³/min",
        factor: 0.028316846592 / 60
      }
    ],
    defaultFrom: 3,
    defaultTo: 1
  },


  temperature: {
    name: "온도",
    temperature: true,

    units: [
      { name: "섭씨", symbol: "°C" },
      { name: "켈빈", symbol: "K" },
      { name: "화씨", symbol: "°F" },
      { name: "랭킨", symbol: "°R" }
    ],

    defaultFrom: 0,
    defaultTo: 2
  }

};



const categorySelect =
  document.getElementById("category");

const inputValue =
  document.getElementById("inputValue");

const fromUnit =
  document.getElementById("fromUnit");

const toUnit =
  document.getElementById("toUnit");

const result =
  document.getElementById("result");

const formula =
  document.getElementById("formula");

const swapButton =
  document.getElementById("swapButton");

const copyButton =
  document.getElementById("copyButton");



for (const key in categories) {

  const option =
    document.createElement("option");

  option.value = key;

  option.textContent =
    categories[key].name;

  categorySelect.appendChild(option);

}



function updateUnits() {

  const category =
    categories[categorySelect.value];

  fromUnit.innerHTML = "";
  toUnit.innerHTML = "";


  category.units.forEach(
    (unit, index) => {

      const option1 =
        document.createElement("option");

      option1.value = index;

      option1.textContent =
        `${unit.name} (${unit.symbol})`;


      const option2 =
        option1.cloneNode(true);


      fromUnit.appendChild(option1);

      toUnit.appendChild(option2);

    }
  );


  fromUnit.value =
    category.defaultFrom;

  toUnit.value =
    category.defaultTo;


  convert();

}



function normalConvert(
  value,
  from,
  to
) {

  const baseValue =
    value * from.factor;

  return baseValue / to.factor;

}



function temperatureConvert(
  value,
  fromSymbol,
  toSymbol
) {

  let kelvin;


  switch (fromSymbol) {

    case "°C":
      kelvin = value + 273.15;
      break;

    case "K":
      kelvin = value;
      break;

    case "°F":
      kelvin =
        (value - 32) * 5 / 9
        + 273.15;
      break;

    case "°R":
      kelvin =
        value * 5 / 9;
      break;

  }


  switch (toSymbol) {

    case "°C":
      return kelvin - 273.15;

    case "K":
      return kelvin;

    case "°F":
      return (kelvin - 273.15)
        * 9 / 5
        + 32;

    case "°R":
      return kelvin * 9 / 5;

  }

}



function formatNumber(number) {

  if (!Number.isFinite(number)) {
    return "-";
  }


  if (number === 0) {
    return "0";
  }


  const absolute =
    Math.abs(number);


  if (
    absolute >= 1e12 ||
    absolute < 1e-7
  ) {

    return number.toExponential(8);

  }


  return new Intl.NumberFormat(
    "ko-KR",
    {
      maximumSignificantDigits: 12
    }
  ).format(number);

}



function convert() {

  const value =
    parseFloat(inputValue.value);


  if (Number.isNaN(value)) {

    result.textContent = "-";

    formula.textContent =
      "값을 입력하세요.";

    return;

  }


  const category =
    categories[categorySelect.value];


  const from =
    category.units[
      Number(fromUnit.value)
    ];


  const to =
    category.units[
      Number(toUnit.value)
    ];


  let converted;


  if (category.temperature) {

    converted =
      temperatureConvert(
        value,
        from.symbol,
        to.symbol
      );

  }

  else {

    converted =
      normalConvert(
        value,
        from,
        to
      );

  }


  const formatted =
    formatNumber(converted);


  result.textContent =
    `${formatted} ${to.symbol}`;


  formula.textContent =
    `${value} ${from.symbol} = ${formatted} ${to.symbol}`;

}



function swapUnits() {

  const previousFrom =
    fromUnit.value;


  fromUnit.value =
    toUnit.value;


  toUnit.value =
    previousFrom;


  convert();

}



async function copyResult() {

  const text =
    result.textContent;


  if (text === "-") {
    return;
  }


  try {

    await navigator.clipboard
      .writeText(text);


    copyButton.textContent =
      "복사 완료 ✓";


    setTimeout(
      () => {

        copyButton.textContent =
          "결과 복사";

      },
      1200
    );

  }

  catch {

    copyButton.textContent =
      "복사 실패";

  }

}



categorySelect.addEventListener(
  "change",
  updateUnits
);


inputValue.addEventListener(
  "input",
  convert
);


fromUnit.addEventListener(
  "change",
  convert
);


toUnit.addEventListener(
  "change",
  convert
);


swapButton.addEventListener(
  "click",
  swapUnits
);


copyButton.addEventListener(
  "click",
  copyResult
);



categorySelect.value =
  "length";

updateUnits();

</script>
